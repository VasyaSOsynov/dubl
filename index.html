<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Дубль</title>
<!-- Мини-приложение бота «Дубль». Шаблоны ниже вписывает tools/webapp.py из dubl_bot.py — вручную их не правьте -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берём из темы Telegram (--tg-theme-*); запасные — для просмотра в обычном браузере */
  :root {
    --fb-bg: #f1f2f6; --fb-card: #ffffff; --fb-text: #14161a; --fb-hint: #7d8590;
    --fb-accent: #6c4dff; --fb-accent-text: #ffffff; --fb-link: #5b3df5;
    --bg: var(--tg-theme-secondary-bg-color, var(--fb-bg));
    --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--fb-card)));
    --text: var(--tg-theme-text-color, var(--fb-text));
    --hint: var(--tg-theme-hint-color, var(--fb-hint));
    --accent: var(--tg-theme-button-color, var(--fb-accent));
    --accent-text: var(--tg-theme-button-text-color, var(--fb-accent-text));
    --link: var(--tg-theme-link-color, var(--fb-link));
    --sep: rgba(127, 127, 127, .18);
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fb-bg: #0e1014; --fb-card: #1a1d23; --fb-text: #f1f2f4; --fb-hint: #8b929c;
            --fb-accent: #7b5cff; --fb-link: #9d86ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
  .app { max-width: 560px; margin: 0 auto; padding: 12px 16px calc(28px + env(safe-area-inset-bottom)); }
  .press { transition: transform .12s ease; }
  .press:active { transform: scale(.97); }

  /* ---------- Шапка ---------- */
  .hero {
    position: relative; overflow: hidden; border-radius: 24px; padding: 20px 18px 22px; color: #fff;
    background: radial-gradient(120% 140% at 0% 0%, #ff4fb8 0%, transparent 55%),
                radial-gradient(120% 140% at 100% 100%, #ff9a3c 0%, transparent 50%),
                linear-gradient(135deg, #5a2bff, #2a0f73);
    min-height: 156px;
  }
  .hero h1 { margin: 0; font-size: 28px; line-height: 1.1; letter-spacing: -.5px; }
  .hero p { margin: 8px 0 0; max-width: 62%; font-size: 14px; opacity: .92; }
  .hero .badge {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 10px; padding: 4px 10px;
    border-radius: 999px; background: rgba(255,255,255,.18); font-size: 12px; font-weight: 600;
  }
  .reel { position: absolute; right: -6px; top: 14px; width: 40%; height: 130px; pointer-events: none; }
  .reel span {
    position: absolute; display: grid; place-items: center; width: 64px; height: 84px; border-radius: 14px;
    font-size: 30px; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28);
    box-shadow: 0 8px 24px rgba(0,0,0,.25); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    animation: float 5s ease-in-out infinite;
  }
  .reel span:nth-child(1) { right: 70px; top: 18px; transform: rotate(-12deg); animation-delay: -1s; }
  .reel span:nth-child(2) { right: 22px; top: 0; transform: rotate(6deg); animation-delay: -2.5s; }
  .reel span:nth-child(3) { right: 36px; top: 62px; transform: rotate(16deg); animation-delay: -4s; }
  @keyframes float { 50% { translate: 0 -7px; } }

  /* ---------- Секции ---------- */
  .sec-head { margin: 22px 4px 4px; font-size: 19px; letter-spacing: -.2px; }
  .sec-sub { margin: 0 4px 12px; color: var(--hint); font-size: 13.5px; }
  .card { background: var(--card); border-radius: var(--radius); }

  .balance { margin-top: 12px; padding: 14px 14px 12px; }
  .balance .label { color: var(--hint); font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .chip { padding: 9px 4px 10px; border-radius: 14px; background: var(--bg); text-align: center; }
  .chip i { display: block; font-style: normal; font-size: 16px; line-height: 1.2; }
  .chip b { display: block; margin-top: 2px; font-size: 20px; line-height: 1.1; }
  .chip small { display: block; margin-top: 3px; color: var(--hint); font-size: 11.5px; line-height: 1.2; }
  /* Цветные эмодзи и там, где система по умолчанию рисует их контуром (🛥, 🏎 в Telegram Desktop на Windows) */
  .chip i, .tile .ico, .reel span, .tpl .emo, .sheet .art {
    font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  .staff { margin-top: 8px; font-weight: 600; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .tile { display: flex; flex-direction: column; gap: 6px; padding: 14px; min-height: 150px; background: var(--card); border-radius: var(--radius); }
  .tile .ico { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; font-size: 22px; color: #fff; }
  .tile b { font-size: 15px; line-height: 1.2; }
  .tile small { color: var(--hint); font-size: 12.5px; line-height: 1.3; }
  .tile .price {
    margin-top: auto; align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
    background: var(--bg);
  }
  .tile .price.on { background: var(--accent); color: var(--accent-text); }
  .tile.off { opacity: .55; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 480px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .tpl {
    position: relative; overflow: hidden; aspect-ratio: 3 / 4; border-radius: 16px; color: #fff;
    display: flex; flex-direction: column; justify-content: flex-end; padding: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
  }
  .tpl .emo { position: absolute; inset: 0 0 34% 0; display: grid; place-items: center; font-size: 46px;
              filter: drop-shadow(0 6px 12px rgba(0,0,0,.3)); }
  .tpl::after { content: ""; position: absolute; inset: 45% 0 0 0; background: linear-gradient(transparent, rgba(0,0,0,.55)); }
  .tpl b { position: relative; z-index: 1; font-size: 14px; line-height: 1.2; text-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .tpl .shine { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.22) 50%, transparent 65%);
                transform: translateX(-100%); animation: shine 6s ease-in-out infinite; }
  @keyframes shine { 0%, 70% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

  .steps { margin-top: 10px; padding: 6px 14px; }
  .step { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
  .step + .step { border-top: 1px solid var(--sep); }
  .step .n { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
             background: var(--accent); color: var(--accent-text); font-weight: 700; font-size: 14px; }

  .faq { margin-top: 10px; padding: 2px 14px; }
  .faq details + details { border-top: 1px solid var(--sep); }
  .faq summary { list-style: none; display: flex; justify-content: space-between; gap: 10px; padding: 13px 0; font-weight: 600; cursor: pointer; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; color: var(--hint); font-weight: 400; font-size: 20px; line-height: 1; transition: transform .2s; }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq p { margin: -4px 0 13px; color: var(--hint); }

  .foot { margin: 18px 6px 0; color: var(--hint); font-size: 12.5px; text-align: center; }

  /* ---------- Карточка шаблона (снизу) ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 560px; margin: 0 auto;
    background: var(--card); border-radius: 22px 22px 0 0; padding: 8px 16px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
    max-height: 92vh; overflow-y: auto;
  }
  .open .backdrop { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: var(--sep); margin: 0 auto 10px; }
  .sheet .art { position: relative; overflow: hidden; height: 170px; border-radius: 18px; display: grid; place-items: center; font-size: 78px; }
  .sheet .art .shine { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.25) 50%, transparent 65%);
                       animation: shine 4s ease-in-out infinite; }
  .sheet h3 { margin: 14px 0 4px; font-size: 21px; }
  .sheet .desc { margin: 0; font-size: 15px; }
  .sheet .meta { margin: 8px 0 14px; color: var(--hint); font-size: 13.5px; }
  .btn { display: flex; width: 100%; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 16px;
         border-radius: 14px; font-weight: 700; font-size: 16px; text-align: center; }
  .btn.main { background: var(--accent); color: var(--accent-text); }
  .btn.alt { margin-top: 8px; background: var(--bg); color: var(--link); }
  .btn small { font-weight: 600; opacity: .85; font-size: 13px; }
  .note { margin: 10px 2px 0; color: var(--hint); font-size: 12.5px; text-align: center; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 20; translate: -50% 20px;
    padding: 10px 16px; border-radius: 12px; background: rgba(20,20,24,.92); color: #fff; font-size: 14px;
    opacity: 0; transition: opacity .2s, translate .2s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; translate: -50% 0; }

  @media (max-width: 360px) {
    .chips { grid-template-columns: repeat(2, 1fr); }
    .hero p { max-width: 58%; }
    .tile { min-height: 140px; padding: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="app" id="app"></main>
<div id="layer">
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  "use strict";

  // ---------- Шаблоны: генерирует tools/webapp.py из TEMPLATES в dubl_bot.py ----------
  const TEMPLATES = /*TEMPLATES*/[{"id": "neon", "emoji": "💃", "ru": ["Танец под неоном", "Вы танцуете на крыше ночного города в неоновых огнях."], "en": ["Neon dance", "You dance on a night-city rooftop in neon lights."]}, {"id": "hero", "emoji": "🦸", "ru": ["Супергерой", "Плащ развевается на ветру, вы стоите на краю небоскрёба на закате."], "en": ["Superhero", "Cape in the wind, you stand on the edge of a skyscraper at sunset."]}, {"id": "action", "emoji": "💥", "ru": ["Сцена из боевика", "Вы уходите от огромного взрыва в замедленной съёмке."], "en": ["Action scene", "You walk away from a huge explosion in slow motion."]}, {"id": "yacht", "emoji": "🛥", "ru": ["На яхте", "Вы отдыхаете на палубе яхты в открытом море, солнце и волны."], "en": ["On a yacht", "You relax on a yacht deck in the open sea, sun and waves."]}, {"id": "winter", "emoji": "❄️", "ru": ["Зимняя сказка", "Снежный лес, падают снежинки, тёплые огоньки вокруг."], "en": ["Winter tale", "A snowy forest, falling snowflakes, warm lights around."]}, {"id": "space", "emoji": "🚀", "ru": ["Космонавт", "Вы парите в невесомости на космической станции, за окном Земля."], "en": ["Astronaut", "You float weightless on a space station with Earth outside the window."]}, {"id": "dragon", "emoji": "🐉", "ru": ["Фэнтези", "Вы летите на драконе над горами и облаками."], "en": ["Fantasy", "You fly on a dragon over mountains and clouds."]}, {"id": "stage", "emoji": "🎤", "ru": ["Звезда сцены", "Огромный концерт: прожекторы, конфетти и ревущая толпа."], "en": ["Stage star", "A huge concert: spotlights, confetti and a roaring crowd."]}, {"id": "racer", "emoji": "🏎", "ru": ["Гонщик", "Вы мчитесь на спорткаре по ночному городу."], "en": ["Racer", "You speed through a night city in a sports car."]}, {"id": "cartoon", "emoji": "🧸", "ru": ["Мультфильм", "Вы становитесь героем 3D-мультфильма."], "en": ["Cartoon", "You become a 3D cartoon character."]}, {"id": "retro", "emoji": "🎞", "ru": ["Старое кино", "Чёрно-белый фильм 1920-х: зерно плёнки и мерцание."], "en": ["Old movie", "A 1920s black-and-white film: film grain and flicker."]}, {"id": "petals", "emoji": "🌹", "ru": ["Романтика", "Вокруг вас кружатся лепестки роз в солнечном саду."], "en": ["Romance", "Rose petals swirl around you in a sunny garden."]}]/*/TEMPLATES*/;

  // Цвета карточек шаблонов; для новых шаблонов цвет подбирается сам
  const PAINT = {
    neon: ["#ff2bd6", "#3b1cff"], hero: ["#ff7a18", "#af002d"], action: ["#f83600", "#b31217"],
    yacht: ["#00c6ff", "#0052d4"], winter: ["#8fb8ff", "#4a5fa8"], space: ["#302b63", "#0f0c29"],
    dragon: ["#614385", "#1d976c"], stage: ["#fc466b", "#3f5efb"], racer: ["#ef473a", "#232526"],
    cartoon: ["#f7971e", "#e8508a"], retro: ["#8e8e8e", "#2b2b2b"], petals: ["#e96443", "#904e95"],
  };

  const I18N = {
    ru: {
      badge: "AI-видео в Telegram",
      tagline: "Оживлю фото, вставлю ваше лицо в видео и улучшу старые снимки",
      balance: "Ваш баланс",
      b_video: "видео", b_swap: "замен лица", b_enh: "улучшений", b_free: "бесплатно сегодня",
      staff: "♾️ Для вас всё бесплатно и без лимитов",
      what: "Что сделаем?",
      create_t: "Оживить фото", create_d: "Опишите сцену — получите видео на {vs} сек",
      swap_t: "Своё лицо в видео", swap_d: "Лицо с фото — в отрывок из фильма или клипа до {sw} сек",
      enh_t: "Улучшить качество", enh_d: "Старое или размытое фото станет чётким и крупным",
      free_t: "Бесплатное видео", free_d: "Облегчённая модель, ролик ~4 сек",
      on_balance: "на балансе: {n}", for_you: "бесплатно", left: "осталось: {n}", left_none: "завтра снова", daily: "каждый день",
      tpl_h: "🔥 Шаблоны", tpl_sub: "Готовые сцены — останется прислать только своё фото",
      meta: "🎬 Видео {vs} секунд",
      go: "Сделать с моим фото", go_balance: "спишется 1 видео", go_free_staff: "бесплатно для вас",
      free: "🎁 Бесплатно", free_n: "🎁 Бесплатно · осталось {n}",
      note: "Дальше — в чате с ботом: он попросит фото и пришлёт видео.",
      how_h: "Как это работает",
      how: ["Выберите, что сделать, — здесь или в меню бота",
            "Подтвердите и оплатите звёздами ⭐ прямо в чате",
            "Пришлите фото — через пару минут придёт результат"],
      faq_h: "Вопросы",
      faq: [
        ["Сколько ждать?", "Видео — 1–4 минуты, замена лица — 1–5 минут, улучшение фото — до минуты. Когда заказов много, бот покажет место в очереди."],
        ["А если не получится?", "Попытка сама вернётся на баланс — можно сразу попробовать ещё раз. Генерацию можно и отменить кнопкой, попытка тоже вернётся."],
        ["Какое фото подходит?", "Чёткое, где хорошо видно лицо. Отправляйте как обычное фото, не файлом. Для улучшения качества можно и файлом."],
        ["Можно вдвоём с другом?", "Да, в «Оживить фото»: напишите в описании «я и мой друг…» и пришлите два фото."],

        ["Как оплатить?", "Звёздами Telegram ⭐ прямо в чате: бот пришлёт счёт после подтверждения."],

      staff: "♾️ Everything is free and unlimited for you",
      what: "What shall we make?",
      create_t: "Animate photo", create_d: "Describe a scene — get a {vs}-second video",
      swap_t: "Face in a video", swap_d: "The face from your photo in a movie or music-video clip up to {sw} sec",
      enh_t: "Enhance quality", enh_d: "An old or blurry photo becomes sharp and large",
      free_t: "Free video", free_d: "Lighter model, ~4-second clip",
      on_balance: "on balance: {n}", for_you: "free", left: "left: {n}", left_none: "back tomorrow", daily: "every day",
      tpl_h: "🔥 Templates", tpl_sub: "Ready-made scenes — just send your photo",
      meta: "🎬 {vs}-second video",
      go: "Make it with my photo", go_balance: "uses 1 video", go_free_staff: "free for you",
      free: "🎁 Free", free_n: "🎁 Free · {n} left",
      note: "Next steps happen in the chat: the bot will ask for a photo and send the video.",

      how: ["Pick what to make — here or in the bot menu",

            "Send a photo — get the result in a couple of minutes"],

  // ---------- Данные от бота (в адресе кнопки) ----------
  const tg = window.Telegram && window.Telegram.WebApp;
  const q = new URLSearchParams(location.search);
  const int = (k, d) => { const v = parseInt(q.get(k), 10); return Number.isFinite(v) ? v : d; };
  const tgLang = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || "ru").toLowerCase();
  const lang = I18N[q.get("l")] ? q.get("l") : (/^(ru|uk|be|kk)/.test(tgLang) ? "ru" : "en");
  const T = I18N[lang];
  const BOT = /^[A-Za-z0-9_]{5,32}$/.test(q.get("b") || "") ? q.get("b") : "dublll_video_bot";
  const PRICE = { video: int("pv", 99), swap: int("ps", 49), enhance: int("pe", 15) };
  const VS = int("vs", 5), SW = int("sw", 10), FREE_PER_DAY = int("fd", 1);
  const HAS_USER = q.has("v");                    // из меню бота — с балансом; из кнопки «Приложение» у поля ввода — без
  const BAL = { video: int("v", 0), swap: int("s", 0), enhance: int("e", 0) };
  const FREE_LEFT = int("f", -2);                  // -1 — админ (всё бесплатно), -2 — неизвестно
  const STAFF = FREE_LEFT === -1;
  document.documentElement.lang = lang;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => (k in o ? o[k] : ""));
  const can = v => tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
  const haptic = kind => { try { if (can("6.1")) kind === "select" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(kind); } catch (e) {} };

  function paint(id) {
    if (PAINT[id]) return PAINT[id];
    let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return [`hsl(${h} 85% 58%)`, `hsl(${(h + 50) % 360} 70% 38%)`];
  }
  const grad = id => { const [a, b] = paint(id); return `linear-gradient(150deg, ${a}, ${b})`; };

  let toastTimer;
  function toast(text) {
    const el = document.getElementById("toast");
    el.textContent = text; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
  }
  function alertBox(text) {
    if (can("6.2")) tg.showAlert(text); else toast(text);
  }

  // Кнопка приложения → команда /start <действие> в чате с ботом → бот запускает тот же сценарий, что и его кнопки
  let leaving = false;
  function go(action) {
    if (leaving || !/^[A-Za-z0-9_-]{1,64}$/.test(action)) return;
    haptic("medium");
    const url = `https://t.me/${BOT}?start=${action}`;
    if (tg && tg.initData) {
      leaving = true;
      toast(T.going);
      tg.openTelegramLink(url);
      setTimeout(() => { leaving = false; tg.close(); }, 350);
    } else {
      window.open(url, "_blank");                 // открыли в обычном браузере
    }
  }

  // ---------- Отрисовка ----------
  function priceBadge(kind) {
    if (STAFF) return `<span class="price on">${esc(T.for_you)}</span>`;
    if (HAS_USER && BAL[kind] > 0) return `<span class="price on">${esc(fmt(T.on_balance, { n: BAL[kind] }))}</span>`;
    return `<span class="price">${PRICE[kind]} ⭐</span>`;
  }

  function freeState() {
    if (STAFF) return { text: "∞", on: true, off: false };
    if (FREE_LEFT === -2) return { text: T.daily, on: false, off: false };
    if (FREE_LEFT > 0) return { text: fmt(T.left, { n: FREE_LEFT }), on: true, off: false };
    return { text: T.left_none, on: false, off: true };
  }

  function tile(action, icon, colors, title, desc, badge, extraClass = "") {
    return `<button class="tile press ${extraClass}" data-go="${action}">
      <span class="ico" style="background:linear-gradient(140deg,${colors[0]},${colors[1]})">${icon}</span>
      <b>${esc(title)}</b><small>${esc(desc)}</small>${badge}</button>`;
  }

  function render() {
    const reel = TEMPLATES.slice(0, 3).map(t => `<span>${esc(t.emoji)}</span>`).join("") || "<span>🎬</span><span>🎭</span><span>🪄</span>";
    let html = `
      <header class="hero">
        <div class="reel" aria-hidden="true">${reel}</div>
        <div class="badge">✨ ${esc(T.badge)}</div>
        <h1>${lang === "ru" ? "Дубль" : "Dubl"}</h1>
        <p>${esc(T.tagline)}</p>
      </header>`;

    if (HAS_USER) {
      html += `<section class="card balance"><div class="label">${esc(T.balance)}</div>`;
      html += STAFF ? `<div class="staff">${esc(T.staff)}</div>` : `
        <div class="chips">
          <div class="chip"><i>🎬</i><b>${BAL.video}</b><small>${esc(T.b_video)}</small></div>
          <div class="chip"><i>🎭</i><b>${BAL.swap}</b><small>${esc(T.b_swap)}</small></div>
          <div class="chip"><i>🪄</i><b>${BAL.enhance}</b><small>${esc(T.b_enh)}</small></div>
          <div class="chip"><i>🎁</i><b>${FREE_PER_DAY > 0 ? Math.max(FREE_LEFT, 0) : "—"}</b><small>${esc(T.b_free)}</small></div>
        </div>`;
      html += `</section>`;
    }

    html += `<h2 class="sec-head">${esc(T.what)}</h2><div class="tiles">`;
    html += tile("create", "🎬", ["#7b5cff", "#c03cff"], T.create_t, fmt(T.create_d, { vs: VS }), priceBadge("video"));
    html += tile("swap", "🎭", ["#ff5e7e", "#ff9a3c"], T.swap_t, fmt(T.swap_d, { sw: SW }), priceBadge("swap"));
    html += tile("enhance", "🪄", ["#17c3b2", "#2f80ed"], T.enh_t, T.enh_d, priceBadge("enhance"));
    if (FREE_PER_DAY > 0 || STAFF) {
      const fs = freeState();
      html += tile("free", "🎁", ["#34c759", "#0fa36b"], T.free_t, T.free_d,
        `<span class="price ${fs.on ? "on" : ""}">${esc(fs.text)}</span>`, fs.off ? "off" : "");
    } else {
      html += tile("templates-scroll", "🔥", ["#ff7a18", "#ff2b6d"], T.tpl_h.replace("🔥 ", ""), T.tpl_sub, "");
    }
    html += `</div>`;

    html += `<h2 class="sec-head">${esc(T.tpl_h)}</h2><p class="sec-sub">${esc(T.tpl_sub)}</p><div class="grid" id="templates">`;
    for (const t of TEMPLATES) {
      html += `<button class="tpl press" data-tpl="${esc(t.id)}" style="background:${grad(t.id)}">
        <span class="shine" style="animation-delay:${(Math.random() * 6).toFixed(1)}s"></span>
        <span class="emo">${esc(t.emoji)}</span><b>${esc(t[lang][0])}</b></button>`;
    }
    html += `</div>`;

    html += `<h2 class="sec-head">${esc(T.how_h)}</h2><section class="card steps">`;
    T.how.forEach((s, i) => { html += `<div class="step"><span class="n">${i + 1}</span><span>${esc(s)}</span></div>`; });
    html += `</section>`;

    html += `<h2 class="sec-head">${esc(T.faq_h)}</h2><section class="card faq">`;
    for (const [qq, a] of T.faq) html += `<details><summary>${esc(qq)}</summary><p>${esc(a)}</p></details>`;
    html += `</section><p class="foot">${esc(T.foot)}</p>`;

    document.getElementById("app").innerHTML = html;
  }

  // ---------- Карточка шаблона ----------
  const layer = document.getElementById("layer");
  const sheet = document.getElementById("sheet");

  function openSheet(id) {
    const t = TEMPLATES.find(x => x.id === id);
    if (!t) return;
    haptic("select");
    const [title, desc] = t[lang];
    let sub = `${PRICE.video} ⭐`;
    if (STAFF) sub = T.go_free_staff;
    else if (HAS_USER && BAL.video > 0) sub = T.go_balance;
    let free = "";
    if (FREE_PER_DAY > 0 && !STAFF && FREE_LEFT !== 0) {
      free = `<button class="btn alt press" data-go="tplfree-${esc(t.id)}">${esc(FREE_LEFT > 0 ? fmt(T.free_n, { n: FREE_LEFT }) : T.free)}</button>`;
    }
    sheet.innerHTML = `
      <div class="grab"></div>
      <div class="art" style="background:${grad(t.id)}"><span class="shine"></span>${esc(t.emoji)}</div>
      <h3 id="sheet-title">${esc(title)}</h3>
      <p class="desc">${esc(desc)}</p>
      <p class="meta">${esc(fmt(T.meta, { vs: VS }))}</p>
      <button class="btn main press" data-go="tpl-${esc(t.id)}">🎬 ${esc(T.go)} <small>· ${esc(sub)}</small></button>
      ${free}
      <p class="note">${esc(T.note)}</p>`;
    layer.classList.add("open");
    if (can("6.1")) { tg.BackButton.show(); }
  }

  function closeSheet() {
    layer.classList.remove("open");
    if (can("6.1")) tg.BackButton.hide();
  }

  // ---------- События ----------
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-go],[data-tpl]");
    if (!el) return;
    if (el.dataset.tpl) { openSheet(el.dataset.tpl); return; }
    const action = el.dataset.go;
    if (action === "templates-scroll") { document.getElementById("templates").scrollIntoView({ behavior: "smooth" }); return; }
    if (action === "free" && !STAFF && FREE_LEFT === 0) { haptic("light"); alertBox(T.free_used); return; }
    go(action);
  });
  document.getElementById("backdrop").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  // Смахивание карточки вниз
  let startY = null;
  sheet.addEventListener("touchstart", e => { startY = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sheet.addEventListener("touchend", e => {
    if (startY !== null && e.changedTouches[0].clientY - startY > 70) closeSheet();
    startY = null;
  }, { passive: true });

  render();

  if (tg) {
    tg.ready();
    tg.expand();
    if (can("6.1")) {
      try { tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("secondary_bg_color"); } catch (e) {}
      tg.BackButton.onClick(closeSheet);
    }
  }
})();
</script>
</body>
</html>
