<title>Дубль</title>
<!-- Мини-приложение бота «Дубль». Шаблоны ниже вписывает tools/webapp.py из dubl_bot.py — вручную их не правьте -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Своя тёмная палитра (не тема Telegram): угольный фон, плоские панели, лаймовый акцент, радужная линия */
  :root {
    --bg: #151515;
    --panel: #262626;
    --bar: #2f2f2f;
    --cell: #202020;
    --line: #3a3a3a;
    --text: #d8d8d8;
    --bright: #efefef;
    --muted: #8e8e8e;
    --link: #4a93d6;
    --accent: #9ac31c;
    --rainbow: linear-gradient(90deg, #37b1da 0%, #cc5ac0 50%, #cce335 100%);
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 13px/1.45 Verdana, Tahoma, "DejaVu Sans", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
  .topline { position: fixed; top: 0; left: 0; right: 0; height: 2px; background: var(--rainbow); z-index: 5; }
  .app { max-width: 720px; margin: 0 auto; padding: 14px 10px calc(20px + env(safe-area-inset-bottom)); }
  .emo { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-style: normal; }

  /* ---------- Панели ---------- */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .panel + .panel { margin-top: 12px; }
  .bar { padding: 9px 10px; background: var(--bar); color: var(--bright); font-weight: bold; font-size: 12px;
         border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bar small { color: var(--muted); font-weight: normal; }
  .line { padding: 9px 12px; }
  .line + .line, .row + .row, .kv + .kv, details + details, .step + .step { border-top: 1px solid var(--line); }
  .muted { color: var(--muted); }
  a, .link { color: var(--link); text-decoration: none; }

  /* Шапка: логотип, навигация, строка статуса */
  .logo { padding: 13px 12px 12px; font: 300 22px/1.1 "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -.3px; color: var(--bright); }
  .logo b { font-weight: 300; color: var(--accent); }
  .nav { display: flex; align-items: center; gap: 18px; padding: 8px 12px; background: var(--bar);
         border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12px; overflow-x: auto; white-space: nowrap; }
  .nav button { color: var(--bright); }
  .nav button:active, .nav button.on { color: var(--accent); }
  .bell { display: grid; place-items: center; width: 18px; height: 18px; position: relative; color: #cfcfcf; }
  .bell.dot::after { content: ""; position: absolute; top: 0; right: 0; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  /* Баланс */
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; }
  .kv b { color: var(--bright); }
  .kv b.on { color: var(--accent); }

  /* Список действий — как список разделов форума */
  .row { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px; }
  .row:active, .cell:active { background: #2d2d2d; }
  .ri { flex: none; display: grid; place-items: center; width: 36px; height: 36px; background: var(--cell);
        border: 1px solid var(--line); border-radius: var(--radius); font-size: 18px; }
  .rt { flex: 1; min-width: 0; }
  .rt .t { display: block; color: var(--link); font-weight: bold; }
  .rt small { display: block; margin-top: 2px; color: var(--muted); font-size: 11.5px; line-height: 1.35; }
  .rp { flex: none; color: var(--bright); font-size: 12px; font-weight: bold; text-align: right; }
  .rp.on { color: var(--accent); }
  .row.off { opacity: .5; }

  /* Шаблоны — сетка ячеек */
  .cells { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--line); border-top: 1px solid var(--line); }
  @media (min-width: 520px) { .cells { grid-template-columns: repeat(3, 1fr); } }
  .cell { display: flex; align-items: center; gap: 9px; padding: 11px 10px; background: var(--panel); min-width: 0; }
  .cell .emo { flex: none; font-size: 22px; }
  .cell .cn { min-width: 0; color: var(--bright); font-size: 12px; line-height: 1.3; }
  .tags { display: block; margin-top: 3px; font-size: 9.5px; font-weight: bold; letter-spacing: .3px; text-transform: uppercase; }
  .tags .hot { color: var(--accent); }
  .tags .new { color: var(--link); }
  .tags .duo { color: #cc5ac0; }
  .tabs { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; white-space: nowrap; border-top: 1px solid var(--line); scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; padding: 5px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--cell); font-size: 12px; }
  .tab.on { border-color: var(--accent); color: var(--accent); }

  .step { display: flex; gap: 10px; padding: 9px 12px; }
  .step b { flex: none; color: var(--accent); }

  details summary { list-style: none; display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; color: var(--link); cursor: pointer; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: "+"; color: var(--muted); }
  details[open] summary::after { content: "−"; }
  details p { margin: 0; padding: 0 12px 11px; color: var(--muted); font-size: 12px; }

  .foot { display: flex; justify-content: space-between; gap: 10px; }

  /* ---------- Карточка шаблона (снизу) ---------- */
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 720px; margin: 0 auto;
           background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
           transform: translateY(105%); transition: transform .24s cubic-bezier(.2,.8,.2,1); max-height: 92vh; overflow-y: auto;
           padding-bottom: env(safe-area-inset-bottom); }
  .sheet::before { content: ""; display: block; height: 2px; background: var(--rainbow); }
  .open .backdrop { opacity: 1; pointer-events: auto; }
  .open .sheet { transform: none; }
  .sheet .close { color: var(--muted); font-size: 16px; padding: 0 2px; }
  .sheet .about { display: flex; gap: 12px; align-items: flex-start; padding: 12px; }
  .sheet .big { flex: none; display: grid; place-items: center; width: 64px; height: 64px; background: var(--cell);
                border: 1px solid var(--line); border-radius: var(--radius); font-size: 34px; }
  .sheet .about p { margin: 0; color: var(--bright); }
  .sheet .about small { display: block; margin-top: 6px; color: var(--muted); font-size: 11.5px; }
  .actions { padding: 0 12px 12px; display: grid; gap: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 44px; padding: 0 12px;
         border-radius: var(--radius); font-weight: bold; font-size: 13px; text-align: center; border: 1px solid var(--line); }
  .btn.main { background: var(--accent); border-color: #b4dc3a; color: #121212; }
  .btn.main small { font-weight: normal; opacity: .8; }
  .btn.alt { background: var(--bar); color: var(--bright); }
  .btn:active { filter: brightness(.9); }
  .note { margin: 0; padding: 0 12px 12px; color: var(--muted); font-size: 11.5px; text-align: center; }

  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 20; translate: -50% 16px;
           padding: 9px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); color: var(--bright);
           font-size: 12px; opacity: 0; transition: opacity .2s, translate .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; translate: -50% 0; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>

      enh_t: "Enhance quality", enh_d: "An old or blurry photo becomes sharp and large",
      free_t: "Free video", free_d: "Lighter model, ~4-second clip",
      on_balance: "on balance: {n}", for_you: "free", left: "left: {n}", left_none: "tomorrow", daily: "every day",
      tpl_h: "🔥 Trending templates", tpl_sub: "What's going viral on TikTok and Reels right now. Pick a scene — just send your photo.",
      meta: "{vs}-second video",
      tabs: { all: "All", hot: "🔥 Top", dance: "Dances", duo: "For two", fx: "Effects", scene: "Scenes" },
      tags: { hot: "top", new: "new", duo: "for two" },
      need2: "👥 Needs 2 photos: yours and the second person's. Full quality only.",
      need_photo: "📸 Needs {what}.",
      go: "Make it with my photo", go_duo: "Make it with our photos", go_balance: "uses 1 video", go_free_staff: "free",
      free: "Free", free_n: "Free · {n} left",
      note: "Next steps happen in the chat: the bot will ask for a photo and send the video.",
      how_h: "How it works",
      how: ["Pick a template or a feature — right here in the app.",
            "Confirm and pay with Telegram Stars ⭐ right in the chat.",
            "Send a photo — get the result in a couple of minutes."],
      faq_h: "Questions",
      faq: [
        ["How long does it take?", "Video — 1–4 minutes, face swap — 1–5 minutes, photo enhancement — up to a minute. When it's busy, the bot shows your place in the queue."],
        ["What if it fails?", "Your attempt goes back to your balance automatically — just try again. You can also cancel a generation with a button and get the attempt back."],
        ["Which photo works best?", "A sharp one with a clearly visible face. Send it as a regular photo, not a file. For enhancement a file is fine too."],
        ["Can I be in a video with a friend?", "Yes, in “Animate photo”: write “me and my friend…” in the description and send two photos."],
        ["Can I make a video with a celebrity?", "No: the bot doesn't make videos of specific people by name. The person in the video comes only from a photo — and only with their consent."],
        ["How do I pay?", "With Telegram Stars ⭐ right in the chat: the bot sends an invoice after you confirm."],
      ],
      bell_free: "🎁 A free video is available today",
      bell_none: "No new notifications",
      free_used: "You've already used today's free video — come back tomorrow!",
      going: "Opening the chat with the bot…",
      foot: "Dubl",
    },
  };

  // ---------- Данные от бота (в адресе кнопки) ----------
  const tg = window.Telegram && window.Telegram.WebApp;
  const user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  const q = new URLSearchParams(location.search);
  const int = (k, d) => { const v = parseInt(q.get(k), 10); return Number.isFinite(v) ? v : d; };
  const tgLang = ((user && user.language_code) || navigator.language || "ru").toLowerCase();
  const lang = I18N[q.get("l")] ? q.get("l") : (/^(ru|uk|be|kk)/.test(tgLang) ? "ru" : "en");
  const T = I18N[lang];
  const BOT = /^[A-Za-z0-9_]{5,32}$/.test(q.get("b") || "") ? q.get("b") : "dublll_video_bot";
  const PRICE = { video: int("pv", 99), swap: int("ps", 49), enhance: int("pe", 15) };
  const VS = int("vs", 5), SW = int("sw", 10), FREE_PER_DAY = int("fd", 1);
  const HAS_USER = q.has("v");                    // из меню бота — с балансом; из кнопки «Приложение» у поля ввода — без
  const BAL = { video: int("v", 0), swap: int("s", 0), enhance: int("e", 0) };
  const FREE_LEFT = int("f", -2);                  // -1 — админ (всё бесплатно), -2 — неизвестно
  const STAFF = FREE_LEFT === -1;
  document.documentElement.lang = lang;

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => (k in o ? o[k] : ""));
  const can = v => tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v);
  const haptic = kind => { try { if (can("6.1")) kind === "select" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(kind); } catch (e) {} };
  // Эмодзи отдельно: у части систем без цветного шрифта они рисуются контуром
  const emo = (e, cls = "") => `<i class="emo ${cls}">${esc(e)}</i>`;
  const label = s => { const [first, ...rest] = s.split(" "); return /\p{L}/u.test(first) ? esc(s) : emo(first) + " " + esc(rest.join(" ")); };

  let toastTimer;
  function toast(text) {
    const el = document.getElementById("toast");
    el.textContent = text; el.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
  }
  const alertBox = text => (can("6.2") ? tg.showAlert(text) : toast(text));

  // Кнопка приложения → команда /start <действие> в чате с ботом → бот запускает тот же сценарий, что и его кнопки
  let leaving = false;
  function go(action) {
    if (leaving || !/^[A-Za-z0-9_-]{1,64}$/.test(action)) return;
    haptic("medium");
    const url = `https://t.me/${BOT}?start=${action}`;
    if (tg && tg.initData) {
      leaving = true;
      toast(T.going);
      tg.openTelegramLink(url);
      setTimeout(() => { leaving = false; tg.close(); }, 350);
    } else {
      window.open(url, "_blank");                 // открыли в обычном браузере
    }
  }

  // ---------- Отрисовка ----------
  const freeAvailable = () => STAFF || (FREE_PER_DAY > 0 && FREE_LEFT !== 0);

  function price(kind) {
    if (STAFF) return `<span class="rp on">${esc(T.for_you)}</span>`;
    if (HAS_USER && BAL[kind] > 0) return `<span class="rp on">${esc(fmt(T.on_balance, { n: BAL[kind] }))}</span>`;
    return `<span class="rp">${PRICE[kind]} ⭐</span>`;
  }

  function freePrice() {
    if (STAFF) return `<span class="rp on">∞</span>`;
    if (FREE_LEFT === -2) return `<span class="rp">${esc(T.daily)}</span>`;
    if (FREE_LEFT > 0) return `<span class="rp on">${esc(fmt(T.left, { n: FREE_LEFT }))}</span>`;
    return `<span class="rp">${esc(T.left_none)}</span>`;
  }

  // Разделы шаблонов: «топ» и «вдвоём» собираются по значкам, остальные — по полю cat
  const FILTERS = ["all", "hot", "dance", "duo", "fx", "scene"];
  let filter = "all";
  const isDuo = t => t.people === 2;
  const matches = (t, f) => f === "all" || (f === "hot" ? t.tag === "hot" : f === "duo" ? isDuo(t) : t.cat === f);

  function cellsHtml() {
    const list = TEMPLATES.filter(t => matches(t, filter));
    const cols = window.matchMedia("(min-width: 520px)").matches ? 3 : 2;
    const blanks = (cols - list.length % cols) % cols;  // пустые ячейки, чтобы последний ряд не зиял серым
    return list.map(t => {
      const tags = [t.tag && `<span class="${esc(t.tag)}">${esc(T.tags[t.tag] || t.tag)}</span>`,
                    isDuo(t) && `<span class="duo">${esc(T.tags.duo)}</span>`].filter(Boolean).join(" · ");
      return `<button class="cell" data-tpl="${esc(t.id)}">${emo(t.emoji)}<span class="cn">${esc(t[lang][0])}` +
             `${tags ? `<small class="tags">${tags}</small>` : ""}</span></button>`;
    }).join("") + `<span class="cell" aria-hidden="true"></span>`.repeat(blanks);
  }

  function setFilter(f) {
    filter = f;
    haptic("select");
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.filter === f));
    document.getElementById("cells").innerHTML = cellsHtml();
  }

  const row = (action, icon, title, desc, right, cls = "") =>
    `<button class="row ${cls}" data-go="${action}"><span class="ri">${emo(icon)}</span>
      <span class="rt"><span class="t">${esc(title)}</span><small>${esc(desc)}</small></span>${right}</button>`;

  function render() {
    const name = user ? [user.first_name, user.last_name].filter(Boolean).join(" ") : "";
    let html = `
      <section class="panel" id="top">
        <div class="logo">${esc(T.logo[0])}<b>${esc(T.logo[1])}</b></div>
        <nav class="nav">
          <button class="bell ${freeAvailable() ? "dot" : ""}" data-bell aria-label="${lang === "ru" ? "Уведомления" : "Notifications"}">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
          </button>
          <button data-scroll="top">${esc(T.nav[0])}</button>
          <button data-scroll="tpl">${esc(T.nav[1])}</button>
          <button data-scroll="faq">${esc(T.nav[2])}</button>
        </nav>
        <div class="line">${name ? fmt(esc(T.hello), { name: `<b class="link">${esc(name)}</b>` }) : esc(T.guest)}</div>
      </section>`;

    if (HAS_USER) {
      html += `<section class="panel"><div class="bar">${esc(T.balance)}</div>`;
      if (STAFF) {
        html += `<div class="line" style="color:var(--accent)">♾️ ${esc(T.staff)}</div>`;
      } else {
        const kv = (k, v) => `<div class="kv"><span>${label(k)}</span><b class="${v > 0 ? "on" : ""}">${v}</b></div>`;
        html += kv(T.b_video, BAL.video) + kv(T.b_swap, BAL.swap) + kv(T.b_enh, BAL.enhance);
        if (FREE_PER_DAY > 0) html += kv(T.b_free, Math.max(FREE_LEFT, 0));
      }
      html += `</section>`;
    }

    // Трендовые шаблоны — главное в приложении, поэтому сразу под балансом; вкладки — только непустые разделы
    const tabs = FILTERS.filter(f => TEMPLATES.some(t => matches(t, f)));
    html += `<section class="panel" id="tpl"><div class="bar"><span>${label(T.tpl_h)}</span> <small>${TEMPLATES.length}</small></div>
      <div class="line muted">${esc(T.tpl_sub)}</div>`;
    if (tabs.length > 2) {
      html += `<div class="tabs">${tabs.map(f => `<button class="tab ${f === filter ? "on" : ""}" data-filter="${f}">${label(T.tabs[f])}</button>`).join("")}</div>`;
    }
    html += `<div class="cells" id="cells">${cellsHtml()}</div></section>`;

    html += `<section class="panel" id="what"><div class="bar">${esc(T.what)}</div>`;
    html += row("create", "🎬", T.create_t, fmt(T.create_d, { vs: VS }), price("video"));
    html += row("swap", "🎭", T.swap_t, fmt(T.swap_d, { sw: SW }), price("swap"));
    html += row("enhance", "🪄", T.enh_t, T.enh_d, price("enhance"));
    if (FREE_PER_DAY > 0 || STAFF) html += row("free", "🎁", T.free_t, T.free_d, freePrice(), freeAvailable() || FREE_LEFT === -2 ? "" : "off");
    html += `</section>`;

    html += `<section class="panel"><div class="bar">${esc(T.how_h)}</div>`;
    T.how.forEach((s, i) => { html += `<div class="step"><b>${i + 1}.</b><span>${label(s)}</span></div>`; });
    html += `</section>`;

    html += `<section class="panel" id="faq"><div class="bar">${esc(T.faq_h)}</div>`;
    for (const [qq, a] of T.faq) html += `<details><summary>${esc(qq)}</summary><p>${esc(a)}</p></details>`;
    html += `</section>`;

    html += `<section class="panel"><div class="line foot"><span>${esc(T.foot)} ${new Date().getFullYear()}</span>
      <a href="https://t.me/${BOT}" data-chat>@${esc(BOT)}</a></div></section>`;

    document.getElementById("app").innerHTML = html;
  }

  // ---------- Карточка шаблона ----------
  const layer = document.getElementById("layer");
  const sheet = document.getElementById("sheet");

  function openSheet(id) {
    const t = TEMPLATES.find(x => x.id === id);
    if (!t) return;
    haptic("select");
    const [title, desc] = t[lang];
    let sub = `${PRICE.video} ⭐`;
    if (STAFF) sub = T.go_free_staff;
    else if (HAS_USER && BAL.video > 0) sub = T.go_balance;
    // Шаблоны на двоих бесплатная модель не умеет (она берёт одно фото)
    const free = FREE_PER_DAY > 0 && !STAFF && FREE_LEFT !== 0 && !isDuo(t)
      ? `<button class="btn alt" data-go="tplfree-${esc(t.id)}">${emo("🎁")} ${esc(FREE_LEFT > 0 ? fmt(T.free_n, { n: FREE_LEFT }) : T.free)}</button>` : "";
    const need = isDuo(t) ? T.need2 : (t.photo ? fmt(T.need_photo, { what: t.photo[lang] || t.photo.ru }) : "");
    sheet.innerHTML = `
      <div class="bar"><span id="sheet-title">${esc(title)}</span><button class="close" data-close aria-label="✕">✕</button></div>
      <div class="about"><span class="big">${emo(t.emoji)}</span>
        <div><p>${esc(desc)}</p><small>${esc(fmt(T.meta, { vs: VS }))}</small>${need ? `<small>${label(need)}</small>` : ""}</div></div>
      <div class="actions">
        <button class="btn main" data-go="tpl-${esc(t.id)}">${esc(isDuo(t) ? T.go_duo : T.go)} <small>· ${esc(sub)}</small></button>
        ${free}
      </div>
      <p class="note">${esc(T.note)}</p>`;
    layer.classList.add("open");
    if (can("6.1")) tg.BackButton.show();
  }

  function closeSheet() {
    layer.classList.remove("open");
    if (can("6.1")) tg.BackButton.hide();
  }

  // ---------- События ----------
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-go],[data-tpl],[data-filter],[data-scroll],[data-close],[data-bell],[data-chat]");
    if (!el) return;
    if (el.dataset.tpl) return openSheet(el.dataset.tpl);
    if (el.dataset.filter) return setFilter(el.dataset.filter);
    if (el.hasAttribute("data-close")) return closeSheet();
    if (el.hasAttribute("data-bell")) { haptic("light"); return toast(freeAvailable() ? T.bell_free : T.bell_none); }
    if (el.hasAttribute("data-chat")) {
      if (tg && tg.initData) { e.preventDefault(); tg.close(); }  // мы и так в чате с ботом — просто закрываемся
      return;
    }
    if (el.dataset.scroll) { haptic("select"); return document.getElementById(el.dataset.scroll).scrollIntoView({ behavior: "smooth", block: "start" }); }
    const action = el.dataset.go;
    if (action === "free" && !STAFF && FREE_LEFT === 0) { haptic("light"); return alertBox(T.free_used); }
    go(action);
  });
  document.getElementById("backdrop").addEventListener("click", closeSheet);
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  // Смахивание карточки вниз
  let startY = null;
  sheet.addEventListener("touchstart", e => { startY = sheet.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sheet.addEventListener("touchend", e => {
    if (startY !== null && e.changedTouches[0].clientY - startY > 70) closeSheet();
    startY = null;
  }, { passive: true });

  render();

  if (tg) {
    tg.ready();
    tg.expand();
    if (can("6.1")) {
      try { tg.setHeaderColor("#151515"); tg.setBackgroundColor("#151515"); } catch (e) {}
      tg.BackButton.onClick(closeSheet);
    }
    if (can("7.10")) { try { tg.setBottomBarColor("#151515"); } catch (e) {} }
  }
})();
</script>
</body>
</html>
